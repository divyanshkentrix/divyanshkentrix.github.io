<style>
:root{
  --k-bg:#f5f7fa; --k-surface:#ffffff; --k-surface-2:#f7f9fc;
  --k-ink:#0f1c2e; --k-slate:#5a6b80; --k-muted:#8a98ab; --k-line:#e4e9f0;
  --k-teal:#3f9c98; --k-teal-600:#348f8b; --k-teal-bright:#34c5c5; --k-teal-soft:#5bbfae;
  --k-navy-700:#2d557b; --k-navy-800:#25496a; --k-navy-900:#1d3a52;
  --k-blue-50:#e9f5f4;
  --k-pos:#1f9d6b; --k-neg:#d6453f; --k-warn:#c9871f;
  --k-card-grad:linear-gradient(135deg,#1d3a52 0%,#46a09a 100%);
  --k-rule:linear-gradient(90deg,#2fbfc6 0%,#5cc9b4 100%);
  --k-radius:10px;
  --k-shadow:0 1px 2px rgba(15,28,46,.06),0 4px 16px rgba(15,28,46,.05);
  /* data encoding — validated categorical trio and a single-hue sequential ramp */
  --c1:#2A6FA8; --c2:#0FA396; --c3:#D2762F;
  --s1:#DCEDEB; --s2:#BFE0DD; --s3:#8CC9C4; --s4:#55AEA8; --s5:#2B8C87; --s6:#11635F;
  --none:#EDF0F2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--k-bg);color:var(--k-ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:18px}

/* ---------- header ---------- */
.top{background:var(--k-card-grad);color:#fff;border-radius:14px;padding:22px 26px;
  box-shadow:var(--k-shadow);position:relative;overflow:hidden}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--k-rule)}
.brandrow{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;border-radius:11px;background:#fff;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.5);box-shadow:0 2px 8px rgba(0,0,0,.12);padding:8px;flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.pmark{height:40px;display:block;margin-bottom:2px}
@media(max-width:620px){.pmark{height:32px}}
.top .sub{font-size:12.5px;opacity:.88;margin-top:3px}
.client-chip{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:4px 11px;
  border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);
  font-size:12.5px;font-weight:600}
.client-chip .lab{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.75;font-weight:600}
.powered{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.powered .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;opacity:.72;font-weight:600}
.klogo-full{height:26px;display:block}
.asof{font-size:11.5px;opacity:.85;text-align:right;margin-top:8px}
.asof b{font-weight:700}

/* ---------- breadcrumb bar ---------- */
nav.crumbs{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--k-surface);
  padding:10px 14px;border-radius:12px;box-shadow:var(--k-shadow);margin:16px 0 16px;
  position:sticky;top:8px;z-index:20;font-size:13px}
.crumb{cursor:pointer;color:var(--k-navy-700);font-weight:600;padding:4px 9px;border-radius:7px}
.crumb:hover{background:var(--k-surface-2)}
.crumb.now{background:var(--k-navy-900);color:#fff;cursor:default}
.crumb.now:hover{background:var(--k-navy-900)}
.sep{color:var(--k-muted)}
.level{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--k-muted);font-weight:700}

/* ---------- headings ---------- */
h2.sec{font-size:17px;color:var(--k-navy-900);margin:4px 2px 4px;font-weight:700;
  display:flex;align-items:center;gap:9px}
h2.sec:before{content:"";width:4px;height:18px;border-radius:2px;background:var(--k-rule)}
p.sub{font-size:12.5px;color:var(--k-muted);margin:0 2px 16px 15px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--k-surface);border-radius:var(--k-radius);padding:16px 18px;box-shadow:var(--k-shadow);
  border:1px solid var(--k-line);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k-rule)}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--k-muted);
  font-weight:600;margin-bottom:6px}
.kpi .val{font-size:24px;font-weight:800;color:var(--k-navy-900);letter-spacing:-.4px}
.kpi .cap{font-size:11.5px;color:var(--k-slate);margin-top:3px}

/* ---------- cards ---------- */
.card{background:var(--k-surface);border-radius:var(--k-radius);padding:18px 20px;
  box-shadow:var(--k-shadow);border:1px solid var(--k-line);min-width:0;margin-bottom:16px}
.card h3{font-size:14.5px;font-weight:700;color:var(--k-navy-900);margin-bottom:3px}
.card .cap{font-size:12px;color:var(--k-muted);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-map{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media(max-width:980px){.grid2,.grid-map{grid-template-columns:minmax(0,1fr)}}
.chartbox{position:relative;height:266px}
.foot{font-size:11.5px;color:var(--k-slate);margin-top:10px;line-height:1.55}
.foot b{color:var(--k-navy-800)}
.note{background:var(--k-blue-50);border:1px solid #cfe8e5;border-radius:9px;padding:12px 15px;
  font-size:12.5px;color:#245b57;line-height:1.55}
.note b{color:#173f3c}

/* ---------- tables ---------- */
.scroll{max-height:440px;overflow:auto;border:1px solid var(--k-line);border-radius:9px;
  background:var(--k-surface)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{text-align:left;padding:9px 11px;border-bottom:2px solid var(--k-line);color:var(--k-slate);
  font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;
  background:var(--k-surface-2);position:sticky;top:0;z-index:2}
thead th.num{text-align:right}
tbody td{padding:8px 11px;border-bottom:1px solid #f0f2f6;white-space:nowrap}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr:hover{background:var(--k-surface-2)}
tbody tr.sel{background:var(--k-blue-50) !important;box-shadow:inset 3px 0 0 var(--k-teal)}
.empty{color:var(--k-muted);font-size:13px;padding:26px 0;text-align:center}

/* ---------- map ---------- */
svg.map{width:100%;height:auto;display:block;background:var(--k-surface-2);
  border:1px solid var(--k-line);border-radius:9px}
.hex{stroke:#fff;stroke-width:.45;cursor:pointer;vector-effect:non-scaling-stroke}
.hex.inp{stroke:#A9BECB;stroke-width:.55}
.hex.dim{fill:#EAEEF2 !important;stroke:#F3F6F8}
.hex:hover{stroke:var(--k-navy-900);stroke-width:1.4}
.hex.sel{stroke:var(--k-navy-900);stroke-width:2}
.dot{fill:var(--c3);stroke:#fff;stroke-width:.8;cursor:pointer;vector-effect:non-scaling-stroke}
.dot.sel{fill:var(--k-navy-900);stroke-width:1.6}
.zlab{font-size:26px;font-weight:700;fill:var(--k-navy-900);pointer-events:none;paint-order:stroke;
  stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--k-slate);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- controls ---------- */
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.ctrls label{font-size:11px;color:var(--k-muted);font-weight:600;text-transform:uppercase;
  letter-spacing:.5px;margin-right:2px}
button.seg{border:1px solid var(--k-line);background:var(--k-surface);padding:6px 13px;border-radius:8px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--k-slate);transition:.15s}
button.seg:hover{background:var(--k-surface-2);color:var(--k-navy-800)}
button.seg[aria-pressed=true]{background:var(--k-navy-900);border-color:var(--k-navy-900);color:#fff}

/* ---------- chips, bars, lists ---------- */
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;
  border:1px solid var(--k-line);background:var(--k-surface-2);color:var(--k-slate)}
.tag.a{background:#fdf1e6;border-color:#f0d5b8;color:#8a4b14}
.tag.b{background:var(--k-blue-50);border-color:#cfe8e5;color:#245b57}
.tag.c{background:#eaf1f8;border-color:#cbdcea;color:#25496a}
.bars{margin:10px 0 2px}
.bar{display:grid;grid-template-columns:132px 1fr 80px;gap:10px;align-items:center;
  margin-bottom:8px;font-size:12.5px;color:var(--k-slate)}
.bar .track{background:#eef1f5;border-radius:4px;height:16px;position:relative;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--k-ink);font-weight:600}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.8px;margin:0}
.dl dt{color:var(--k-slate)}
.dl dd{margin:0;font-variant-numeric:tabular-nums;color:var(--k-ink);font-weight:600}

/* ---------- tooltip & footer ---------- */
#tip{position:fixed;pointer-events:none;background:#12212E;color:#fff;padding:8px 11px;border-radius:7px;
  font-size:12px;line-height:1.5;opacity:0;transition:opacity .08s;z-index:60;max-width:255px;
  box-shadow:0 6px 20px rgba(15,28,46,.25)}
#tip b{color:var(--k-teal-bright)}
.pagefoot{display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--k-muted);font-size:11.5px;padding:22px 0 10px;flex-wrap:wrap}
.pagefoot img{height:18px;opacity:.9}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const RAMP = ['#DCEDEB','#BFE0DD','#8CC9C4','#55AEA8','#2B8C87','#11635F'];
const C1='#2A6FA8', C2='#0FA396', C3='#D2762F', NONE='#EDF0F2';
const fmt = n => n==null||isNaN(n) ? '—' : Math.round(n).toLocaleString('en-IN');
const pct = n => n==null||isNaN(n) ? '—' : n.toFixed(1)+'%';
const pct2 = n => n==null||isNaN(n) ? '—' : n.toFixed(2)+'%';
const big = n => n==null||isNaN(n) ? '—' : (n>=1e5 ? (n/1e6).toFixed(2)+'M' : Math.round(n).toLocaleString('en-IN'));

const hexById = {}; D.hexes.forEach(h => hexById[h.i] = h);
const byHex = {}, byZoneO = {}, byZoneH = {};
D.outlets.forEach(o => { (byHex[o.h] = byHex[o.h] || []).push(o);
                         (byZoneO[o.z] = byZoneO[o.z] || []).push(o); });
D.hexes.forEach(h => (byZoneH[h.z] = byZoneH[h.z] || []).push(h));
const zoneById = {}; D.zones.forEach(z => zoneById[z.z] = z);

let S = { level:'city', zone:null, hex:null, outlet:null, metric:'gu' };
const charts = [];
function clearCharts(){ while(charts.length) charts.pop().destroy(); }

/* ---------- quantile colour scale ---------------------------------------- */
function scaleFor(vals){
  const v = vals.filter(x => x!=null && !isNaN(x) && x>0).sort((a,b)=>a-b);
  if(!v.length) return { cut:[], color:()=>NONE, labels:['no data'] };
  const q = p => v[Math.min(v.length-1, Math.floor(p*(v.length-1)))];
  const cut = [q(.2),q(.4),q(.6),q(.8),q(.95)];
  const color = x => {
    if(x==null || isNaN(x) || x<=0) return NONE;
    let i=0; while(i<cut.length && x>cut[i]) i++;
    return RAMP[i];
  };
  return { cut, color };
}

/* ---------- tooltip ------------------------------------------------------- */
const tip = document.getElementById('tip');
function showTip(e, html){ tip.innerHTML = html; tip.style.opacity = 1;
  const p = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + p, y = e.clientY + p;
  if(x + w > innerWidth - 8) x = e.clientX - w - p;
  if(y + h > innerHeight - 8) y = e.clientY - h - p;
  tip.style.left = x+'px'; tip.style.top = y+'px'; }
function hideTip(){ tip.style.opacity = 0; }

/* ---------- navigation ---------------------------------------------------- */
function go(patch){ S = Object.assign({}, S, patch); render(); window.scrollTo({top:0}); }

function crumbs(){
  const el = document.getElementById('crumbs'); el.innerHTML = '';
  const parts = [{ t:'City A', s:{level:'city', zone:null, hex:null, outlet:null} }];
  if(S.zone) parts.push({ t:S.zone, s:{level:'zone', hex:null, outlet:null} });
  if(S.hex) parts.push({ t:'Locality '+S.hex, s:{level:'locality', outlet:null} });
  if(S.outlet) parts.push({ t:'Outlet '+S.outlet, s:{level:'outlet'} });
  parts.forEach((p,i) => {
    if(i){ const s = document.createElement('span'); s.className='sep'; s.textContent='›'; el.appendChild(s); }
    const a = document.createElement('span');
    a.className = 'crumb' + (i===parts.length-1 ? ' now' : '');
    a.textContent = p.t;
    if(i < parts.length-1) a.onclick = () => go(p.s);
    el.appendChild(a);
  });
  const lv = document.createElement('span');
  lv.className = 'level';
  lv.textContent = { city:'City view', zone:'Area view', locality:'Locality view', outlet:'Outlet view' }[S.level];
  el.appendChild(lv);
}

/* ---------- map ----------------------------------------------------------- */
const METRICS = {
  gu:  { lab:'Fair-share gap (units)', fmt:fmt,  get:h=>h.gu },
  sa:  { lab:'Diageo share (%)',       fmt:pct,  get:h=>h.sa },
  mkt: { lab:'Category market (units)',fmt:fmt,  get:h=>h.mkt },
  ds:  { lab:'Demand score',           fmt:v=>v==null?'—':v.toFixed(1), get:h=>h.ds },
};

function mapSVG(opts){
  const m = METRICS[S.metric];
  const pool = opts.pool || D.hexes;
  const sc = scaleFor(D.hexes.map(m.get));
  const W = D.meta.W, H = D.meta.H;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  let vb = [0,0,W,H], K = 1;
  if(opts.zoom && opts.zoom.length){
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    opts.zoom.forEach(h => {
      const n = h.d.match(/-?\d+\.?\d*/g).map(Number);
      for(let i=0;i<n.length;i+=2){
        if(n[i]<x0)x0=n[i]; if(n[i]>x1)x1=n[i];
        if(n[i+1]<y0)y0=n[i+1]; if(n[i+1]>y1)y1=n[i+1];
      }
    });
    const padx = Math.max(18, (x1-x0)*0.28), pady = Math.max(18, (y1-y0)*0.28);
    x0-=padx; x1+=padx; y0-=pady; y1+=pady;
    let w = x1-x0, hgt = y1-y0;
    const ar = W/H;
    if(w/hgt < ar){ const nw = hgt*ar; x0 -= (nw-w)/2; w = nw; }
    else { const nh = w/ar; y0 -= (nh-hgt)/2; hgt = nh; }
    vb = [x0,y0,w,hgt]; K = w/W;
  }
  svg.setAttribute('viewBox', vb.map(v=>Math.round(v*10)/10).join(' '));
  svg.setAttribute('class','map');
  const inPool = new Set(pool.map(h=>h.i));
  D.hexes.forEach(h => {
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', h.d);
    p.setAttribute('fill', sc.color(m.get(h)));
    p.setAttribute('class','hex' + (inPool.has(h.i)?(opts.pool?' inp':''):' dim') + (S.hex===h.i?' sel':''));
    p.addEventListener('mousemove', e => showTip(e,
      '<b>Locality '+h.i+'</b><br>'+h.z+' &middot; '+h.role+
      '<br>Outlets: '+fmt(h.n)+
      '<br>Market: '+fmt(h.mkt)+' units'+
      '<br>Share: '+pct(h.sa)+' vs expected '+pct(h.se)+
      '<br>Gap: '+fmt(h.gu)+' units'));
    p.addEventListener('mouseleave', hideTip);
    p.addEventListener('click', () => { hideTip(); go({ level:'locality', zone:h.z, hex:h.i, outlet:null }); });
    svg.appendChild(p);
  });
  if(opts.zoneLabels){
    D.zones.forEach(z => {
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', z.cx); t.setAttribute('y', z.cy);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','zlab');
      t.setAttribute('style','font-size:'+(26*K)+'px;stroke-width:'+(3.5*K)+'px');
      t.textContent = z.z.replace('Area ','');
      svg.appendChild(t);
    });
  }
  if(opts.dots){
    opts.dots.forEach(o => {
      if(o.x==null) return;
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', o.x); c.setAttribute('cy', o.y);
      c.setAttribute('r', (S.outlet===o.i ? 8 : (opts.dots.length > 250 ? 3.6 : 5.2)) * K);
      c.setAttribute('class','dot' + (S.outlet===o.i?' sel':''));
      c.addEventListener('mousemove', e => showTip(e,
        '<b>Outlet '+o.i+'</b><br>'+o.tier+
        '<br>Market: '+fmt(o.mkt)+' units'+
        '<br>Share: '+pct(o.sa)+' vs expected '+pct(o.se)+
        '<br>Gap: '+fmt(o.gu)+' units'));
      c.addEventListener('mouseleave', hideTip);
      c.addEventListener('click', () => { hideTip(); go({ level:'outlet', outlet:o.i, hex:o.h, zone:o.z }); });
      svg.appendChild(c);
    });
  }
  const wrap = document.createElement('div');
  wrap.appendChild(svg);
  const lg = document.createElement('div'); lg.className='legend';
  const labs = ['lowest 20%','20–40%','40–60%','60–80%','80–95%','top 5%'];
  RAMP.forEach((c,i) => { const s=document.createElement('span');
    s.innerHTML = '<i style="background:'+c+'"></i>'+labs[i]; lg.appendChild(s); });
  const s0 = document.createElement('span');
  s0.innerHTML = '<i style="background:'+NONE+';border:1px solid #D8DEE3"></i>zero or not measured';
  lg.appendChild(s0);
  wrap.appendChild(lg);
  const cap = document.createElement('p'); cap.className='foot';
  cap.textContent = 'Shading: ' + m.lab + ', quantile bins across all ' + fmt(D.hexes.length) +
    ' localities.' + (opts.dots ? ' Markers are outlets, plotted inside their own locality cell.' : '') +
    ' No basemap, coordinate grid or scale is shown.';
  wrap.appendChild(cap);
  return wrap;
}

function metricCtrls(){
  const d = document.createElement('div'); d.className='ctrls';
  const l = document.createElement('label'); l.textContent='Shade localities by'; d.appendChild(l);
  Object.keys(METRICS).forEach(k => {
    const b = document.createElement('button');
    b.className='seg'; b.textContent = METRICS[k].lab;
    b.setAttribute('aria-pressed', S.metric===k);
    b.onclick = () => go({ metric:k });
    d.appendChild(b);
  });
  return d;
}

/* ---------- table helper --------------------------------------------------- */
function buildTable(cols, rows, onClick, selId){
  const wrap = document.createElement('div'); wrap.className='scroll';
  const t = document.createElement('table');
  const th = document.createElement('thead'); const tr = document.createElement('tr');
  cols.forEach(c => { const e=document.createElement('th');
    e.textContent=c.h; if(c.n) e.style.textAlign='right'; tr.appendChild(e); });
  th.appendChild(tr); t.appendChild(th);
  const tb = document.createElement('tbody');
  rows.forEach(r => {
    const row = document.createElement('tr');
    if(onClick){ row.className = 'click' + (selId && r._id===selId ? ' sel' : '');
                 row.onclick = () => onClick(r); }
    cols.forEach(c => { const e=document.createElement('td');
      e.innerHTML = c.v(r); if(c.n) e.className='num'; row.appendChild(e); });
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}
function card(title, cap){
  const c = document.createElement('div'); c.className='card';
  if(title){ const h=document.createElement('h3'); h.textContent=title; c.appendChild(h); }
  if(cap){ const p=document.createElement('p'); p.className='cap'; p.textContent=cap; c.appendChild(p); }
  return c;
}
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html; return e; }

    let sx=0, sy=0; for(let i=0;i<n.length;i+=2){ sx+=n[i]; sy+=n[i+1]; }

  v.appendChild(g);

  if(o.sku){
    const cs = card('Recommended lines for this outlet',
      'Ranked by expected volume. Each line is matched on catchment demand and on what comparable '
      +'outlets nearby already carry.');
    cs.appendChild(buildTable([
      { h:'#', n:1, v:r=>r.r }, { h:'Line', v:r=>r.b }, { h:'Category', v:r=>r.c },
      { h:'Expected volume', n:1, v:r=>r.v==null?'\u2014':r.v.toFixed(1)+' units' },
      { h:'Confidence', n:1, v:r=>r.cf==null?'\u2014':r.cf+'%' },
      { h:'Comparable outlets carrying it', n:1, v:r=>r.lk }],
      o.sku.map(s => Object.assign({ _id:s.b }, s))));
    cs.appendChild(el('p','foot','Expected volume is <b>gross, not incremental</b>. '
      +'\u201cComparable outlets carrying it\u201d is the evidence behind the line: how many of the '
      +'nearest lookalike outlets already stock it.'));
    v.appendChild(cs);
  } else {
    const cs = card('Recommended lines for this outlet', null);
    cs.appendChild(el('p','empty','No assortment call. This outlet already carries the range its '
      +'catchment supports.'));
    v.appendChild(cs);
  }

  const c3 = card('Position in the locality', 'This outlet against the others in Locality '+(o.h||'—')+'.');
  const peers = (byHex[o.h]||[]).slice().sort((a,b)=>(b.gu||0)-(a.gu||0));
  if(peers.length > 1){
    c3.appendChild(buildTable([
      { h:'Outlet', v:r=>r.i }, { h:'Market', n:1, v:r=>fmt(r.mkt) },
      { h:'Share', n:1, v:r=>pct(r.sa) }, { h:'Expected', n:1, v:r=>pct(r.se) },
      { h:'Gap', n:1, v:r=>fmt(r.gu) }, { h:'Call', v:r=>r.tier }],
      peers.map(p => Object.assign({ _id:p.i }, p)),
      r => go({ outlet:r.i }), o.i));
  } else {
    c3.appendChild(el('p','empty','This is the only Diageo outlet in its locality.'));
  }
  v.appendChild(c3);
}

function render(){
  clearCharts(); hideTip(); crumbs();
  ({ city:viewCity, zone:viewZone, locality:viewLocality, outlet:viewOutlet })[S.level]();
}
render();
</script>
